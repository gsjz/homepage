<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="data:,">
    <title>简历</title>
    <script>
        (() => {
            const scope = location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") || "/";

            const storageKey = "resume-access:v1:" + scope;

            function savedKey() {
                try { return localStorage.getItem(storageKey) || ""; }
                catch { return ""; }
            }

            function forgetKey(expected) {
                try {
                    if (expected === undefined || localStorage.getItem(storageKey) === expected) {
                        localStorage.removeItem(storageKey);
                    }
                    return true;
                } catch { return false; }
            }

            function addMemoryControls(remembered, accessKey, pdfKey) {
                const pdfInfo = JSON.parse(document.querySelector("#resume-pdf").textContent);
                if (pdfInfo.version !== 1 || !/^[a-f0-9]{64}$/.test(pdfInfo.sha256)
                    || pdfInfo.path !== "resume-" + pdfInfo.sha256 + ".pdf.enc"
                    || typeof pdfInfo.filename !== "string"
                    || !/^[^/\\\x00-\x1f]{1,100}\.pdf$/.test(pdfInfo.filename)) {
                    throw new Error("Invalid PDF descriptor");
                }
                const style = document.createElement("style");
                style.id = "resume-access-controls-style";
                style.textContent = `
                    #resume-access-controls {
                        position: fixed; right: max(16px, env(safe-area-inset-right));
                        bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10;
                        display: flex; align-items: center; gap: 2px; padding: 4px;
                        border: 1px solid #e5e7eb; border-radius: 3px;
                        background: #fff; color: #6b7280; box-shadow: 0 2px 10px #1118270a;
                    }
                    #resume-access-controls button {
                        display: grid; place-items: center; width: 42px; height: 42px;
                        margin: 0; padding: 0; border: 0; border-radius: 2px;
                        background: transparent; color: inherit; cursor: pointer;
                        transition: color 200ms, background-color 200ms;
                    }
                    #resume-access-controls button:hover { background: #f3f4f6; color: #2563eb; }
                    #resume-access-controls button:focus-visible { outline: 2px solid #bfdbfe; outline-offset: 1px; }
                    #resume-access-controls button:disabled { opacity: .45; cursor: wait; }
                    #resume-access-controls button[data-success] { color: #2563eb; }
                    #resume-access-controls button + button { position: relative; }
                    #resume-access-controls button + button::before {
                        content: ""; position: absolute; left: -1px; top: 13px;
                        width: 1px; height: 16px; background: #e5e7eb;
                    }
                    #resume-access-controls svg {
                        display: block; width: 18px; height: 18px; fill: none;
                        stroke: currentColor; stroke-width: 1.5;
                        stroke-linecap: round; stroke-linejoin: round;
                    }
                    #resume-memory-note {
                        position: absolute; right: 0; bottom: calc(100% + 10px);
                        width: max-content; max-width: min(280px, calc(100vw - 32px));
                        margin: 0; padding: 9px 12px; border: 1px solid #e5e7eb;
                        border-radius: 3px; background: #fff; color: #6b7280;
                        font: 12px/1.7 "Noto Serif SC", "Songti SC", "SimSun", serif;
                        box-shadow: 0 2px 10px #1118270a;
                    }
                    #resume-memory-note:empty { display: none; }
                    .resume-copy-buffer { position: fixed; left: -9999px; top: 0; opacity: 0; font-size: 16px; }
                    @media print { #resume-access-controls { display: none !important; } }
                    @media (prefers-reduced-motion: reduce) {
                        #resume-access-controls button { transition: none; }
                    }
                `;
                document.head.append(style);
                const controls = document.createElement("aside");
                controls.id = "resume-access-controls";
                controls.setAttribute("aria-label", "简历工具");
                const note = document.createElement("p");
                note.id = "resume-memory-note";
                note.setAttribute("role", "status");
                note.setAttribute("aria-live", "polite");
                let noteTimer;
                function notify(text, duration = 3500) {
                    clearTimeout(noteTimer);
                    note.textContent = text;
                    if (duration) noteTimer = setTimeout(() => { note.textContent = ""; }, duration);
                }
                function action(id, label, paths) {
                    const button = document.createElement("button");
                    button.id = id;
                    button.type = "button";
                    button.title = label;
                    button.setAttribute("aria-label", label);
                    const ns = "http://www.w3.org/2000/svg";
                    const svg = document.createElementNS(ns, "svg");
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.setAttribute("aria-hidden", "true");
                    paths.forEach(d => {
                        const path = document.createElementNS(ns, "path");
                        path.setAttribute("d", d);
                        svg.append(path);
                    });
                    button.append(svg);
                    controls.append(button);
                    return button;
                }
                const forget = action("forget-resume-key", "清除记忆并锁定", [
                    "M7 10V7a5 5 0 0 1 10 0v3",
                    "M6 10h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z",
                    "M12 14v3",
                ]);
                forget.title = (remembered ? "此浏览器已记住访问权限；" : "") + "清除记忆并锁定";
                forget.addEventListener("click", () => {
                    if (forgetKey()) {
                        accessKey = "";
                        pdfKey = null;
                        history.replaceState(null, "", location.pathname + location.search);
                        location.reload();
                    } else {
                        notify("未能清除，请在浏览器设置中清除此网站数据", 0);
                    }
                });
                const copy = action("copy-resume-link", "复制带密钥链接", [
                    "M10 13a5 5 0 0 0 7 .5l3-3a5 5 0 0 0-7-7l-1.5 1.5",
                    "M14 11a5 5 0 0 0-7-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5",
                ]);
                function legacyCopy(url) {
                    const buffer = document.createElement("textarea");
                    buffer.className = "resume-copy-buffer";
                    buffer.value = url;
                    buffer.readOnly = true;
                    buffer.setAttribute("aria-hidden", "true");
                    const previous = document.activeElement;
                    const x = scrollX;
                    const y = scrollY;
                    document.body.append(buffer);
                    try {
                        buffer.focus({preventScroll: true});
                        buffer.select();
                        if (!document.execCommand("copy")) throw new Error("Copy unavailable");
                    } finally {
                        buffer.remove();
                        previous?.focus({preventScroll: true});
                        if (scrollX !== x || scrollY !== y) scrollTo(x, y);
                    }
                }
                copy.addEventListener("click", async () => {
                    if (copy.disabled) return;
                    const wasFocused = document.activeElement === copy;
                    copy.disabled = true;
                    const url = new URL(location.href);
                    url.hash = new URLSearchParams({pwd: accessKey}).toString();
                    try {
                        try { await navigator.clipboard.writeText(url.href); }
                        catch { legacyCopy(url.href); }
                        copy.setAttribute("data-success", "");
                        notify("已复制带密钥链接");
                        setTimeout(() => copy.removeAttribute("data-success"), 2000);
                    } catch {
                        notify("复制失败，请复制地址栏中的完整链接");
                    } finally {
                        copy.disabled = false;
                        if (wasFocused && document.activeElement === document.body) {
                            copy.focus({preventScroll: true});
                        }
                    }
                });
                const pdf = action("save-resume-pdf", "保存为 PDF", [
                    "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z",
                    "M14 2v6h6", "M12 11v7m-3-3 3 3 3-3",
                ]);
                pdf.addEventListener("click", async () => {
                    if (pdf.disabled) return;
                    const wasFocused = document.activeElement === pdf;
                    pdf.disabled = true;
                    pdf.setAttribute("aria-busy", "true");
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 45000);
                    try {
                        notify("正在准备 PDF…", 0);
                        const response = await fetch(new URL(pdfInfo.path, location.href), {
                            credentials: "omit", referrerPolicy: "no-referrer", redirect: "error",
                            mode: "same-origin", cache: "force-cache", signal: controller.signal,
                        });
                        if (!response.ok) throw new Error("PDF unavailable");
                        const encrypted = new Uint8Array(await response.arrayBuffer());
                        const magic = [82, 80, 68, 70, 1]; // RPDF + format version.
                        if (encrypted.length < 33 || !magic.every((byte, index) => encrypted[index] === byte)) {
                            throw new Error("Invalid encrypted PDF");
                        }
                        const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", encrypted));
                        const checksum = Array.from(digest, byte => byte.toString(16).padStart(2, "0")).join("");
                        if (checksum !== pdfInfo.sha256) throw new Error("PDF version mismatch");
                        const bytes = new Uint8Array(await crypto.subtle.decrypt({
                            name: "AES-GCM", iv: encrypted.subarray(5, 17),
                            additionalData: new TextEncoder().encode("resume:pdf:v1"), tagLength: 128,
                        }, pdfKey, encrypted.subarray(17)));
                        if (new TextDecoder().decode(bytes.subarray(0, 5)) !== "%PDF-") {
                            throw new Error("Invalid PDF");
                        }
                        const downloadUrl = URL.createObjectURL(new Blob([bytes], {type: "application/pdf"}));
                        const link = document.createElement("a");
                        link.href = downloadUrl;
                        link.download = pdfInfo.filename;
                        link.hidden = true;
                        document.body.append(link);
                        try { link.click(); }
                        finally {
                            link.remove();
                            setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
                        }
                        notify("PDF 已准备好下载");
                    } catch {
                        notify("PDF 下载失败，请重试；若页面已更新，请刷新后再试");
                    } finally {
                        clearTimeout(timeout);
                        pdf.disabled = false;
                        pdf.removeAttribute("aria-busy");
                        if (wasFocused && document.activeElement === document.body) {
                            pdf.focus({preventScroll: true});
                        }
                    }
                });
                controls.append(note);
                document.body.append(controls);
                if (!remembered) notify("浏览器未能保存，可收藏当前链接", 0);
            }

            function linkKey() {
                return new URLSearchParams(location.hash.slice(1)).get("pwd") || "";
            }

            document.addEventListener("DOMContentLoaded", () => {
                const form = document.querySelector("#unlock-form");
                const input = document.querySelector("#access-key");
                const button = document.querySelector("#unlock-button");
                const message = document.querySelector("#unlock-message");
                const loadStatus = document.querySelector("#resume-load-status");
                let busy = false;
                let payloadPromise;
                let payloadReady = false;
                let payloadFailed = false;
                let retryCredential;

                function showMessage(text, invalid = false) {
                    message.textContent = text;
                    input.setAttribute("aria-invalid", String(invalid));
                }

                function decodeBase64Url(value) {
                    if (typeof value !== "string" || !/^[A-Za-z0-9_-]+$/.test(value)) {
                        throw new Error("Invalid encoding");
                    }
                    const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
                    return Uint8Array.from(atob(base64 + "=".repeat((4 - base64.length % 4) % 4)),
                        (character) => character.charCodeAt(0));
                }

                function loadResume() {
                    if (payloadPromise) return payloadPromise;
                    payloadReady = false;
                    loadStatus.textContent = "简历加载中，可先输入访问密钥。";
                    payloadPromise = (async () => {
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 45000);
                        try {
                            const manifest = JSON.parse(document.querySelector("#resume-payload").textContent);
                            if (manifest.version !== 2 || manifest.algorithm !== "AES-256-GCM"
                                || !/^[a-f0-9]{64}$/.test(manifest.sha256)
                                || manifest.path !== "resume-" + manifest.sha256 + ".html.enc") {
                                throw new Error("Invalid resume manifest");
                            }
                            const response = await fetch(new URL(manifest.path, location.href), {
                                credentials: "omit", referrerPolicy: "no-referrer", redirect: "error",
                                mode: "same-origin", cache: payloadFailed ? "reload" : "force-cache",
                                signal: controller.signal,
                            });
                            if (!response.ok) throw new Error("Resume unavailable");
                            const encrypted = new Uint8Array(await response.arrayBuffer());
                            const magic = [82, 72, 84, 77, 76, 1]; // RHTML + format version.
                            if (encrypted.length < 34 || !magic.every((byte, index) => encrypted[index] === byte)) {
                                throw new Error("Invalid encrypted resume");
                            }
                            const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", encrypted));
                            const checksum = Array.from(digest, byte => byte.toString(16).padStart(2, "0")).join("");
                            if (checksum !== manifest.sha256) throw new Error("Resume version mismatch");
                            payloadReady = true;
                            payloadFailed = false;
                            loadStatus.textContent = "简历已就绪。";
                            return encrypted;
                        } finally {
                            clearTimeout(timeout);
                        }
                    })().catch(error => {
                        payloadPromise = null;
                        payloadFailed = true;
                        loadStatus.textContent = "简历加载失败，可点击下方按钮重试。";
                        throw error;
                    });
                    return payloadPromise;
                }

                async function unlock(value, fromMemory = false) {
                    if (busy) {
                        return;
                    }

                    let token = value.trim();
                    value = "";
                    if (!token) {
                        showMessage("请输入访问密钥。", true);
                        input.focus();
                        return;
                    }

                    busy = true;
                    input.value = "";
                    input.disabled = true;
                    button.disabled = true;
                    button.textContent = "正在解锁…";
                    form.setAttribute("aria-busy", "true");
                    showMessage("");
                    let keyBytes;
                    let stage = "key";
                    retryCredential = null;

                    try {
                        if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
                            throw new Error("Invalid key");
                        }
                        keyBytes = decodeBase64Url(token);
                        const canonical = btoa(String.fromCharCode(...keyBytes))
                            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
                        if (keyBytes.length !== 32 || canonical !== token) {
                            throw new Error("Invalid key");
                        }
                        const key = await crypto.subtle.importKey(
                            "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"],
                        );
                        keyBytes.fill(0);

                        stage = "load";
                        if (!payloadReady) {
                            button.textContent = "正在加载简历…";
                            showMessage("正在加载简历，完成后将自动解锁。");
                        }
                        const encrypted = await loadResume();
                        stage = "decrypt";
                        button.textContent = "正在解锁…";
                        showMessage("");
                        const decrypted = await crypto.subtle.decrypt({
                            name: "AES-GCM",
                            iv: encrypted.subarray(6, 18),
                            additionalData: new TextEncoder().encode("resume:v1"),
                            tagLength: 128,
                        }, key, encrypted.subarray(18));
                        stage = "render";
                        const html = new TextDecoder("utf-8", { fatal: true }).decode(decrypted);
                        // Remember only after authenticated decryption has succeeded.
                        let remembered = false;
                        try {
                            localStorage.setItem(storageKey, token);
                            remembered = true;
                        } catch { /* Storage restrictions must not prevent this visit. */ }
                        const fragment = new URLSearchParams({pwd: token}).toString();
                        history.replaceState(null, "", location.pathname + location.search + "#" + fragment);

                        // Load a complete document so the resume's layout/print scripts run normally.
                        document.open();
                        document.write(html);
                        document.close();
                        addMemoryControls(remembered, token, key);
                    } catch {
                        if (stage === "load") {
                            retryCredential = {token, fromMemory};
                            showMessage("简历加载失败，请重试；若页面已更新，请刷新后再试。");
                        } else if (stage === "key" || stage === "decrypt") {
                            if (fromMemory) forgetKey(token);
                            showMessage(fromMemory ? "已保存的密钥已失效，请重新输入访问密钥。"
                                : "无法解锁，请检查访问密钥后重试。", true);
                        } else {
                            showMessage("页面打开失败，请刷新后重试。");
                        }
                        input.disabled = false;
                        button.disabled = false;
                        button.textContent = retryCredential ? "重试加载" : "查看简历";
                        form.setAttribute("aria-busy", "false");
                        input.focus();
                    } finally {
                        token = "";
                        keyBytes?.fill(0);
                        busy = false;
                    }
                }

                form.addEventListener("submit", (event) => {
                    event.preventDefault();
                    const retry = retryCredential;
                    void unlock(input.value || retry?.token || "", !input.value && Boolean(retry?.fromMemory));
                });
                input.addEventListener("input", () => {
                    retryCredential = null;
                    showMessage("");
                    if (!busy) button.textContent = "查看简历";
                });

                if (!window.isSecureContext || !window.crypto?.subtle) {
                    input.disabled = true;
                    button.disabled = true;
                    showMessage("请使用支持安全解密的现代浏览器，通过 HTTPS 打开此页面。");
                    return;
                }

                input.disabled = false;
                button.disabled = false;
                // Prefetch independently so downloading the resume never blocks typing.
                void loadResume().catch(() => {});
                window.addEventListener("hashchange", () => {
                    const key = linkKey();
                    if (key) {
                        void unlock(key);
                    }
                });
                const fragment = new URLSearchParams(location.hash.slice(1));
                const supplied = fragment.get("pwd");
                if (supplied !== null) {
                    void unlock(supplied);
                } else {
                    const remembered = savedKey();
                    if (remembered) void unlock(remembered, true);
                }
            }, { once: true });
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; background: #f3f4f6; }
        body {
            margin: 0;
            color: #111827;
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
            -webkit-font-smoothing: antialiased;
        }
        main {
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }
        .card {
            width: 100%;
            max-width: 480px;
            padding: 40px 38px 30px;
            background: #fff;
            box-shadow: 0 0 10px rgb(0 0 0 / 10%);
        }
        .document-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e5e7eb;
        }
        h1 { margin: 0; font-size: 26px; line-height: 1.4; font-weight: 700; }
        .document-mark {
            color: #9ca3af;
            font: italic 11px/1.4 Georgia, "Times New Roman", serif;
            letter-spacing: .16em;
        }
        .description { margin: 20px 0 28px; color: #6b7280; font-size: 13px; line-height: 1.9; }
        label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
        input, button { width: 100%; min-height: 44px; border-radius: 2px; }
        input {
            display: block;
            padding: 11px 12px;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #111827;
            font: 16px/1.4 "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
            transition: border-color 200ms, box-shadow 200ms;
        }
        input::placeholder { color: #9ca3af; font: 13px/1.4 "Songti SC", "SimSun", serif; }
        input:focus { outline: none; border-color: #93b4ea; box-shadow: 0 0 0 2px #eff6ff; }
        input[aria-invalid="true"] { border-color: #f0b2b2; }
        button {
            margin-top: 18px;
            padding: 11px 16px;
            border: 1px solid #dbe7f9;
            background: #f3f7fe;
            color: #2563eb;
            font: 700 13px/1.5 "Noto Serif SC", "Songti SC", "SimSun", serif;
            cursor: pointer;
            transition: background-color 200ms, border-color 200ms;
        }
        button:hover:not(:disabled) { background: #eaf2ff; border-color: #b9d1f4; }
        button:focus-visible { outline: 2px solid #bfdbfe; outline-offset: 3px; }
        button:disabled { opacity: .65; cursor: default; }
        .message { min-height: 20px; margin: 10px 0 0; color: #b42318; font-size: 12px; line-height: 1.65; }
        .load-status { min-height: 20px; margin: 0 0 10px; color: #6b7280; font-size: 12px; line-height: 1.65; }
        .document-footer {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 22px 0 0;
            padding-top: 16px;
            border-top: 1px dashed #e5e7eb;
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.8;
        }
        .document-footer svg { flex-shrink: 0; margin-top: 3px; }
        noscript p { margin: 0 0 20px; color: #b42318; font-size: 13px; line-height: 1.7; }
        @media (max-width: 380px) {
            main { padding: 24px 14px; }
            .card { padding: 30px 24px 24px; }
        }
        @media (prefers-reduced-motion: reduce) { input, button { transition: none; } }
    </style>
</head>

<body>
    <main>
        <section class="card" aria-labelledby="unlock-title">
            <header class="document-heading">
                <h1 id="unlock-title">简历</h1>
                <span class="document-mark" aria-hidden="true">RESUME</span>
            </header>
            <p class="description">请输入访问密钥，查看完整简历。</p>
            <noscript><p>请启用 JavaScript，以解锁并查看简历。</p></noscript>
            <form id="unlock-form" autocomplete="off">
                <label for="access-key">访问密钥</label>
                <p id="resume-load-status" class="load-status" role="status" aria-live="polite"></p>
                <input id="access-key" type="password" placeholder="粘贴访问密钥" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="unlock-message resume-load-status" aria-invalid="false" disabled>
                <button id="unlock-button" type="submit" disabled>查看简历</button>
                <p id="unlock-message" class="message" role="status" aria-live="polite"></p>
            </form>
            <p class="document-footer">
                <svg aria-hidden="true" width="12" height="14" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="14" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4M12 16v4" />
                </svg>
                <span>此浏览器会自动记忆，后续无需重复输入。</span>
            </p>
        </section>
    </main>
    <script type="application/json" id="resume-payload">{"version":2,"algorithm":"AES-256-GCM","path":"resume-909e2c5bb6edd9832cb1c9a8bd154838ccd8c65453b90c6c3033e8bcabd1a744.html.enc","sha256":"909e2c5bb6edd9832cb1c9a8bd154838ccd8c65453b90c6c3033e8bcabd1a744"}</script>
</body>

</html>
